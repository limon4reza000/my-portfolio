  <text x="140" y="140" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">5</text><text x="168" y="140" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#f4f5f2">  email: z.</tspan><tspan fill="#82aaff">string</tspan><tspan fill="#f4f5f2">().</tspan><tspan fill="#82aaff">email</tspan><tspan fill="#f4f5f2">(),</tspan></text>
