  <line x1="0" y1="34" x2="600" y2="34" stroke="#283238"/>
  <rect x="0" y="34" width="120" height="346" fill="#090d0f"/>
  <text x="14" y="58" font-family="Geist Mono, ui-monospace, monospace" font-size="10" fill="#929b9f">EXPLORER</text>
  <text x="14" y="82" font-family="Geist Mono, ui-monospace, monospace" font-size="11" xml:space="preserve" fill="#929b9f">src</text>
  <text x="14" y="100" font-family="Geist Mono, ui-monospace, monospace" font-size="11" xml:space="preserve" fill="#929b9f">  routes</text>
  <text x="14" y="118" font-family="Geist Mono, ui-monospace, monospace" font-size="11" xml:space="preserve" fill="#b7f36b">    contact.ts</text>
  <text x="14" y="136" font-family="Geist Mono, ui-monospace, monospace" font-size="11" xml:space="preserve" fill="#929b9f">    portfolio.ts</text>
  <text x="14" y="154" font-family="Geist Mono, ui-monospace, monospace" font-size="11" xml:space="preserve" fill="#929b9f">  lib</text>
  <text x="14" y="172" font-family="Geist Mono, ui-monospace, monospace" font-size="11" xml:space="preserve" fill="#929b9f">  app.ts</text>
  <text x="14" y="190" font-family="Geist Mono, ui-monospace, monospace" font-size="11" xml:space="preserve" fill="#929b9f">prisma</text>
  <text x="14" y="208" font-family="Geist Mono, ui-monospace, monospace" font-size="11" xml:space="preserve" fill="#929b9f">  schema.prisma</text>
  <text x="140" y="64" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">1</text><text x="168" y="64" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#c792ea">import</tspan><tspan fill="#f4f5f2"> { z } </tspan><tspan fill="#c792ea">from</tspan><tspan fill="#b7f36b"> 'zod'</tspan><tspan fill="#f4f5f2">;</tspan></text>
  <text x="140" y="83" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">2</text><text x="168" y="83" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"></text>
  <text x="140" y="102" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">3</text><text x="168" y="102" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#c792ea">const</tspan><tspan fill="#f4f5f2"> contactSchema </tspan><tspan fill="#c792ea">=</tspan><tspan fill="#f4f5f2"> z.</tspan><tspan fill="#82aaff">object</tspan><tspan fill="#f4f5f2">({</tspan></text>
