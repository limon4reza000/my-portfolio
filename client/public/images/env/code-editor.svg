  <text x="140" y="178" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">7</text><text x="168" y="178" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#f4f5f2">  message: z.</tspan><tspan fill="#82aaff">string</tspan><tspan fill="#f4f5f2">().</tspan><tspan fill="#82aaff">min</tspan><tspan fill="#f4f5f2">(</tspan><tspan fill="#f78c6c">10</tspan><tspan fill="#f4f5f2">),</tspan></text>
  <text x="140" y="197" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">8</text><text x="168" y="197" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#f4f5f2">});</tspan></text>
  <text x="140" y="216" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">9</text><text x="168" y="216" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"></text>
  <text x="140" y="235" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">10</text><text x="168" y="235" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#546e7a">// validate, then store in PostgreSQL</tspan></text>
  <text x="140" y="254" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">11</text><text x="168" y="254" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#f4f5f2">router.</tspan><tspan fill="#82aaff">post</tspan><tspan fill="#f4f5f2">(</tspan><tspan fill="#b7f36b">'/contact'</tspan><tspan fill="#f4f5f2">, </tspan><tspan fill="#c792ea">async</tspan><tspan fill="#f4f5f2"> (req, res) =&gt; {</tspan></text>
  <text x="140" y="273" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">12</text><text x="168" y="273" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#c792ea">  const</tspan><tspan fill="#f4f5f2"> data </tspan><tspan fill="#c792ea">=</tspan><tspan fill="#f4f5f2"> contactSchema.</tspan><tspan fill="#82aaff">parse</tspan><tspan fill="#f4f5f2">(req.body);</tspan></text>
  <text x="140" y="292" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">13</text><text x="168" y="292" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#c792ea">  await</tspan><tspan fill="#f4f5f2"> prisma.message.</tspan><tspan fill="#82aaff">create</tspan><tspan fill="#f4f5f2">({ data });</tspan></text>
  <text x="140" y="311" font-family="Geist Mono, ui-monospace, monospace" font-size="11" fill="#3a4750" text-anchor="end">14</text><text x="168" y="311" font-family="Geist Mono, ui-monospace, monospace" font-size="12" xml:space="preserve"><tspan fill="#f4f5f2">  res.</tspan><tspan fill="#82aaff">status</tspan><tspan fill="#f4f5f2">(</tspan><tspan fill="#f78c6c">201</tspan><tspan fill="#f4f5f2">).</tspan><tspan fill="#82aaff">json</tspan><tspan fill="#f4f5f2">({ ok: </tspan><tspan fill="#f78c6c">true</tspan><tspan fill="#f4f5f2"> });</tspan></text>
